name: update-and-deploy
on:
  schedule:
    - cron: "0 11 * * 1,2,5"   # Mon/Tue (after Sun/Mon games), Fri (Thu games); UTC
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python pipeline/fetch.py
      - run: uv run python pipeline/build.py
      - run: uv run python pipeline/check.py
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "af-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/raw public/data
          if ! git diff --cached --quiet; then git commit -m "chore: refresh data" && git push; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
